<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Controle de Notebooks</title>
<style>
  :root{
    --bg: #14181c;
    --panel: #1b2126;
    --panel-raised: #212932;
    --line: #2c3640;
    --ink: #e7ecef;
    --ink-dim: #8fa0ad;
    --steel: #5b9bd1;
    --steel-dim: #2f4a5e;
    --amber: #d6a04a;
    --amber-dim: #4a3c22;
    --green: #5fae7f;
    --green-dim: #21402f;
    --red: #c4695a;
    --mono: "IBM Plex Mono", "SFMono-Regular", Consolas, monospace;
    --sans: "Inter", "Segoe UI", system-ui, sans-serif;
  }
  *{box-sizing:border-box;}
  :root{ box-sizing:border-box; padding-top:env(safe-area-inset-top, 0px); padding-bottom:env(safe-area-inset-bottom, 0px); }
  html{ scroll-padding-top:env(safe-area-inset-top, 0px); }
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--sans);height:100%;}
  #root{display:flex;min-height:100vh;flex-wrap:wrap;}

  /* Sidebar */
  nav.side{
    width:210px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--line);
    padding:24px 0;display:flex;flex-direction:column;gap:2px;
  }
  .brand{padding:0 20px 20px 20px;border-bottom:1px solid var(--line);margin-bottom:12px;}
  .brand .tag{font-family:var(--mono);font-size:11px;color:var(--steel);letter-spacing:0.04em;}
  .brand h1{font-size:16px;margin:4px 0 0 0;font-weight:600;line-height:1.3;}
  .navbtn{
    background:none;border:none;color:var(--ink-dim);text-align:left;padding:11px 20px;
    font-size:14px;cursor:pointer;border-left:2px solid transparent;font-family:var(--sans);
  }
  .navbtn:hover{color:var(--ink);background:rgba(255,255,255,0.02);}
  .navbtn.active{color:var(--ink);border-left-color:var(--steel);background:var(--panel-raised);}
  .side-foot{margin-top:auto;padding:16px 20px 0 20px;font-size:11px;color:var(--ink-dim);border-top:1px solid var(--line);font-family:var(--mono);}

  main{flex:1;padding:32px 40px;max-width:980px;}

  @media (max-width: 640px){
    #root{flex-direction:column;}
    nav.side{width:100%;flex-direction:row;flex-wrap:wrap;padding:16px;align-items:center;gap:6px;}
    .brand{border-bottom:none;margin-bottom:0;padding:0 12px 0 0;flex-shrink:0;}
    .brand h1{font-size:14px;}
    .navbtn{padding:8px 12px;border-left:none;border-radius:4px;font-size:13px;}
    .navbtn.active{border-left:none;background:var(--panel-raised);color:var(--steel);}
    .side-foot{display:none;}
    main{padding:20px 16px;}
    .row{flex-direction:column;}
  }
  h2.title{font-size:22px;margin:0 0 4px 0;font-weight:600;}
  p.sub{color:var(--ink-dim);font-size:14px;margin:0 0 28px 0;}

  /* Stat strip */
  .stats{display:flex;gap:14px;margin-bottom:28px;}
  .stat{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px 16px;}
  .stat .n{font-size:26px;font-weight:600;font-family:var(--mono);}
  .stat .l{font-size:12px;color:var(--ink-dim);margin-top:2px;}
  .stat.ok .n{color:var(--green);}
  .stat.out .n{color:var(--amber);}

  /* Cards grid */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;}
  .card{
    background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px;
    position:relative;
  }
  .card .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .card h3{margin:0;font-size:15px;font-weight:600;}
  .card .patr{font-family:var(--mono);font-size:11px;color:var(--ink-dim);margin-top:2px;}
  .badge{font-size:11px;padding:3px 8px;border-radius:20px;font-weight:600;white-space:nowrap;}
  .badge.disp{background:var(--green-dim);color:var(--green);}
  .badge.retirado{background:var(--amber-dim);color:var(--amber);}
  .card .meta{margin-top:12px;font-size:12.5px;color:var(--ink-dim);line-height:1.7;}
  .card .meta b{color:var(--ink);font-weight:500;}
  .card .tagline{font-family:var(--mono);font-size:11px;color:var(--steel);margin-top:10px;border-top:1px dashed var(--line);padding-top:8px;}
  .empty{color:var(--ink-dim);font-size:14px;padding:30px 0;text-align:center;border:1px dashed var(--line);border-radius:6px;}

  /* Forms */
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:24px;max-width:520px;}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:12.5px;color:var(--ink-dim);margin-bottom:6px;}
  .field input, .field select{
    width:100%;background:var(--bg);border:1px solid var(--line);border-radius:4px;
    padding:10px 12px;color:var(--ink);font-size:14px;font-family:var(--sans);
  }
  .field input:focus, .field select:focus{outline:none;border-color:var(--steel);}
  .field .mono-input{font-family:var(--mono);}
  .row{display:flex;gap:10px;}
  .row .field{flex:1;}

  .nfc-box{
    border:1px solid var(--line);border-radius:5px;padding:14px;margin-bottom:16px;
    background:var(--bg);
  }
  .nfc-box .lbl{font-size:12.5px;color:var(--ink-dim);margin-bottom:8px;}
  .nfc-status{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:13px;}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--ink-dim);flex-shrink:0;}
  .dot.on{background:var(--green);}
  .dot.wait{background:var(--amber);animation:pulse 1s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.35;}}

  button.btn{
    background:var(--steel);color:#0e1418;border:none;border-radius:4px;padding:10px 18px;
    font-size:13.5px;font-weight:600;cursor:pointer;font-family:var(--sans);
  }
  button.btn:hover{filter:brightness(1.08);}
  button.btn:disabled{opacity:0.4;cursor:not-allowed;}
  button.btn.secondary{background:transparent;border:1px solid var(--line);color:var(--ink);}
  button.btn.secondary:hover{border-color:var(--steel);}
  button.btn.small{padding:7px 12px;font-size:12.5px;}
  button.btn.full{width:100%;}
  .btnrow{display:flex;gap:10px;margin-top:20px;}

  .msg{font-size:13px;padding:10px 12px;border-radius:4px;margin-bottom:16px;}
  .msg.ok{background:var(--green-dim);color:var(--green);}
  .msg.err{background:rgba(196,105,90,0.15);color:var(--red);}
  .msg.info{background:var(--steel-dim);color:var(--steel);}

  /* Movimentação flow */
  .step{display:flex;align-items:center;gap:10px;margin-bottom:14px;opacity:0.4;}
  .step.active{opacity:1;}
  .step.done{opacity:0.7;}
  .step .num{
    width:22px;height:22px;border-radius:50%;border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;font-size:11px;font-family:var(--mono);flex-shrink:0;
  }
  .step.active .num{border-color:var(--steel);color:var(--steel);}
  .step.done .num{border-color:var(--green);color:var(--green);background:var(--green-dim);}
  .step .txt{font-size:13.5px;}

  /* History table */
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{text-align:left;font-size:11px;color:var(--ink-dim);font-weight:500;padding:8px 10px;border-bottom:1px solid var(--line);}
  td{padding:10px 10px;border-bottom:1px solid var(--line);}
  td.mono{font-family:var(--mono);font-size:12px;color:var(--ink-dim);}
  .tipo{font-size:11px;padding:2px 8px;border-radius:20px;font-weight:600;}
  .tipo.saida{background:var(--amber-dim);color:var(--amber);}
  .tipo.entrada{background:var(--green-dim);color:var(--green);}

  .hint{font-size:11.5px;color:var(--ink-dim);margin-top:6px;line-height:1.5;}
  select.notebook-select{cursor:pointer;}
  .tagpop{position:fixed;inset:0;background:rgba(10,13,16,0.82);display:flex;align-items:center;justify-content:center;z-index:99;padding:20px;}
  .tagpop .box{background:var(--panel-raised);border:2px solid var(--green);border-radius:10px;padding:28px 24px;text-align:center;max-width:360px;width:100%;}
  .tagpop.new .box{border-color:var(--steel);}
  .tagpop.err .box{border-color:var(--red);}
  .tagpop .ic{width:64px;height:64px;border-radius:50%;background:var(--green-dim);color:var(--green);font-size:34px;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;}
  .tagpop.new .ic{background:var(--steel-dim);color:var(--steel);}
  .tagpop.err .ic{background:rgba(196,105,90,0.2);color:var(--red);}
  .tagpop h3{margin:0 0 6px 0;font-size:19px;}
  .tagpop p{margin:0 0 18px 0;color:var(--ink-dim);font-size:14px;line-height:1.5;}
</style>
</head>
<body>
<div id="root"></div>

<script>
const state = {
  view: 'dashboard',
  notebooks: [],
  movimentos: [],
  loaded: false,
  flow: { step: 1, notebook: null, nfcOk: false, pessoa: '', tipo: null },
  cadastro: { nome:'', patrimonio:'', nfcTag:'', nfcOk:false },
  config: { apiUrl:'', apiKey:'' },
  apiStatus: 'unknown', // 'unknown' | 'checking' | 'ok' | 'error'
  msg: null,
  popup: null
};

function loadConfig(){
  try{
    const raw = localStorage.getItem('api-config');
    if(raw) state.config = JSON.parse(raw);
  }catch(e){}
}
function saveConfig(){
  try{ localStorage.setItem('api-config', JSON.stringify(state.config)); }catch(e){}
}

function apiBase(){ return (state.config.apiUrl || '').replace(/\/+$/,''); }

async function apiFetch(path, options={}){
  const base = apiBase();
  if(!base) throw new Error('API não configurada. Vá em "Configurações" e informe a URL do servidor.');
  const headers = Object.assign({ 'Content-Type':'application/json' }, options.headers || {});
  if(state.config.apiKey) headers['x-api-key'] = state.config.apiKey;
  const res = await fetch(base + path, Object.assign({}, options, { headers }));
  let data = null;
  try{ data = await res.json(); }catch(e){}
  if(!res.ok){
    throw new Error((data && data.error) ? data.error : ('Erro ' + res.status + ' ao falar com a API.'));
  }
  return data;
}

async function testApiConnection(){
  state.apiStatus = 'checking'; render();
  try{
    await apiFetch('/api/health');
    state.apiStatus = 'ok';
  }catch(e){
    state.apiStatus = 'error';
  }
  render();
}

async function loadData(){
  loadConfig();
  if(!apiBase()){
    state.notebooks = []; state.movimentos = []; state.loaded = true; render();
    return;
  }
  try{
    state.notebooks = await apiFetch('/api/notebooks');
    state.movimentos = await apiFetch('/api/movimentos');
    state.apiStatus = 'ok';
  }catch(e){
    state.apiStatus = 'error';
    state.msg = { where:'dashboard', type:'err', text: 'Não foi possível carregar dados da API: ' + e.message };
  }
  state.loaded = true;
  await handleTagParam();
  render();
}

/* Tag NFC gravada como URL (?tag=CODIGO): ao encostar o celular, o app abre já identificando a tag */
function tagFeedback(popup){
  state.popup = popup;
  try{ if(navigator.vibrate) navigator.vibrate(popup.kind==='err'?[200,100,200]:120); }catch(e){}
  try{
    const AC = window.AudioContext || window.webkitAudioContext;
    if(AC){ const a = new AC(), o = a.createOscillator(), g = a.createGain();
      o.frequency.value = popup.kind==='err' ? 220 : 880; g.gain.value = 0.15;
      o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime + 0.18); }
  }catch(e){}
  setTimeout(()=>{ if(state.popup===popup){ state.popup = null; render(); } }, 6000);
}

async function handleTagParam(){
  let tag = null;
  try{ tag = new URLSearchParams(location.search).get('tag'); }catch(e){}
  if(!tag) return;
  tag = tag.trim();
  try{ history.replaceState(null, '', location.pathname); }catch(e){}
  if(!apiBase()){ state.view = 'config'; state.msg = {where:'config', type:'info', text:'Configure a API para usar a tag lida (' + escapeHtml(tag) + ').'}; return; }
  const nb = state.notebooks.find(n=>n.nfcTag === tag);
  if(nb && nb.status==='retirado'){
    // devolução automática: registra na hora, em nome de quem retirou
    const pessoa = nb.retiradoPor || '—';
    try{
      const result = await apiFetch('/api/movimentos', { method:'POST', body: JSON.stringify({ notebookId: nb.id, nfcTag: nb.nfcTag, pessoa }) });
      const idx = state.notebooks.findIndex(n=>n.id===result.notebook.id);
      if(idx>=0) state.notebooks[idx] = result.notebook;
      state.movimentos.push(result.movimento);
      state.view = 'dashboard';
      state.msg = {where:'dashboard', type:'ok', text:'Devolução registrada automaticamente: ' + escapeHtml(nb.nome) + ' (' + escapeHtml(pessoa) + ').'};
      tagFeedback({kind:'ok', title:'Tag reconhecida!', text:'<b>' + escapeHtml(nb.nome) + '</b><br>Devolução registrada em nome de ' + escapeHtml(pessoa) + '.'});
    }catch(e){
      state.view = 'dashboard';
      state.msg = {where:'dashboard', type:'err', text:'Falha ao registrar devolução: ' + e.message};
      tagFeedback({kind:'err', title:'Tag lida, mas falhou', text:'Não consegui registrar a devolução: ' + escapeHtml(e.message)});
    }
  } else if(nb){
    state.view = 'movimentar';
    state.flow = { step:3, notebook: nb, nfcOk:true, pessoa:'', tipo: nb.status==='disponivel'?'saida':'entrada' };
    state.msg = {where:'movimentar', type:'ok', text:'Tag reconhecida: ' + escapeHtml(nb.nome) + '. Informe o nome e confirme.'};
    tagFeedback({kind:'ok', title:'Tag reconhecida!', text:'<b>' + escapeHtml(nb.nome) + '</b><br>Informe quem está retirando e confirme.'});
  } else {
    state.view = 'cadastrar';
    state.cadastro.nfcTag = tag; state.cadastro.nfcOk = true;
    state.msg = {where:'cadastrar', type:'ok', text:'Tag nova lida (' + escapeHtml(tag) + '). Preencha os dados do notebook e salve.'};
    tagFeedback({kind:'new', title:'Tag nova lida', text:'Código <b>' + escapeHtml(tag) + '</b> ainda não está cadastrado. Preencha os dados do notebook.'});
  }
}


function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function fmtDate(ts){
  const d = new Date(ts);
  return d.toLocaleDateString('pt-BR') + ' ' + d.toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'});
}

/* ---------- NFC (Web NFC API, fallback manual) ---------- */
function nfcSupported(){ return 'NDEFReader' in window; }

async function readNfcTag(onRead, onError){
  if(!nfcSupported()){ onError('Web NFC indisponível neste navegador. Use Chrome no Android.'); return; }
  try{
    const reader = new NDEFReader();
    await reader.scan();
    reader.onreading = (event) => {
      const id = event.serialNumber || uid();
      onRead(id);
    };
    reader.onreadingerror = () => onError('Falha ao ler a tag. Aproxime novamente.');
  }catch(e){
    onError('Não foi possível ativar o leitor NFC (' + (e.message || 'permissão negada') + ').');
  }
}


function render(){
  const root = document.getElementById('root');
  if(!state.loaded){
    root.innerHTML = '<div style="padding:40px;color:#8fa0ad;font-family:sans-serif;">Carregando...</div>';
    return;
  }
  root.innerHTML = `
    <nav class="side">
      <div class="brand">
        <div class="tag">ATIVOS · TI</div>
        <h1>Controle de<br>Notebooks</h1>
      </div>
      ${navBtn('dashboard','Painel')}
      ${navBtn('movimentar','Registrar movimentação')}
      ${navBtn('cadastrar','Cadastrar notebook')}
      ${navBtn('historico','Histórico')}
      ${navBtn('config','Configurações')}
      <div class="side-foot">${state.notebooks.length} equipamento(s)<br>${state.movimentos.length} registro(s)</div>
    </nav>
    <main>${renderView()}</main>
    ${state.popup ? `<div class="tagpop ${state.popup.kind}"><div class="box"><div class="ic">${state.popup.kind==='err'?'!':(state.popup.kind==='new'?'+':'✓')}</div><h3>${state.popup.title}</h3><p>${state.popup.text}</p><button class="btn full" data-action="fechar-popup">OK</button></div></div>` : ''}
  `;
  attachHandlers();
}

function navBtn(id, label){
  return `<button class="navbtn ${state.view===id?'active':''}" data-nav="${id}">${label}</button>`;
}

function renderView(){
  if(!apiBase() && state.view!=='config') return renderNoApi();
  if(state.view==='dashboard') return renderDashboard();
  if(state.view==='cadastrar') return renderCadastro();
  if(state.view==='movimentar') return renderMovimentar();
  if(state.view==='historico') return renderHistorico();
  if(state.view==='config') return renderConfig();
  return '';
}

function renderNoApi(){
  return `
    <h2 class="title">Configure a API primeiro</h2>
    <p class="sub">Este app precisa de um endereço de servidor para guardar os dados e compartilhá-los entre aparelhos.</p>
    <div class="panel">
      <div class="msg info">Vá em <b>Configurações</b> e informe a URL do seu backend (ex: https://seu-servidor.com).</div>
      <button class="btn full" data-nav="config">Ir para Configurações</button>
    </div>
  `;
}

function renderConfig(){
  const c = state.config;
  const statusLabel = { unknown:'Não testado', checking:'Testando…', ok:'Conectado', error:'Falha na conexão' }[state.apiStatus];
  const statusClass = { unknown:'', checking:'wait', ok:'on', error:'' }[state.apiStatus];
  return `
    <h2 class="title">Configurações</h2>
    <p class="sub">Informe o endereço do backend que guarda os notebooks e o histórico. Assim os dados ficam iguais em qualquer aparelho.</p>
    <div class="panel">
      ${state.msg && state.msg.where==='config' ? `<div class="msg ${state.msg.type}">${state.msg.text}</div>` : ''}
      <div class="field">
        <label>URL da API</label>
        <input id="cfg-url" class="mono-input" type="text" placeholder="https://seu-servidor.com" value="${escapeAttr(c.apiUrl)}">
      </div>
      <div class="field">
        <label>Chave de API (opcional, se o servidor exigir)</label>
        <input id="cfg-key" class="mono-input" type="text" placeholder="deixe em branco se não usar" value="${escapeAttr(c.apiKey)}">
      </div>
      <div class="nfc-status" style="margin-bottom:10px;">
        <span class="dot ${statusClass}"></span><span>Status: ${statusLabel}</span>
      </div>
      <div class="btnrow">
        <button class="btn" data-action="testar-api">Testar conexão</button>
        <button class="btn secondary" data-action="salvar-config">Salvar</button>
      </div>
      <div class="hint">A URL é a do servidor onde você hospedou a API (veja o README do projeto de backend). Ex: um serviço no Render/Railway, ou um servidor na sua rede local.</div>
    </div>
  `;
}

function renderDashboard(){
  const disponiveis = state.notebooks.filter(n=>n.status==='disponivel').length;
  const retirados = state.notebooks.filter(n=>n.status==='retirado').length;
  const cards = state.notebooks.length ? state.notebooks.map(n=>`
    <div class="card">
      <div class="top">
        <div>
          <h3>${escapeHtml(n.nome)}</h3>
          <div class="patr">PAT. ${escapeHtml(n.patrimonio || '—')}</div>
        </div>
        <span class="badge ${n.status==='disponivel'?'disp':'retirado'}">${n.status==='disponivel'?'Disponível':'Retirado'}</span>
      </div>
      <div class="meta">
        ${n.status==='retirado' ? `<div>Com: <b>${escapeHtml(n.retiradoPor||'—')}</b></div><div>Desde: <b>${n.dataRetirada?fmtDate(n.dataRetirada):'—'}</b></div>` : `${n.ultimaDevolucao ? `<div>Devolvido por: <b>${escapeHtml(n.ultimaDevolucao.pessoa)}</b></div><div>Em: <b>${fmtDate(n.ultimaDevolucao.data)}</b></div>` : ``}`}
      </div>
      <div class="tagline">TAG ${escapeHtml(n.nfcTag || 'sem tag')}</div>
      <div class="btnrow" style="margin-top:12px;"><button class="btn secondary small" data-del="${escapeAttr(n.id)}">Excluir</button></div>
    </div>
  `).join('') : '<div class="empty">Nenhum notebook cadastrado ainda. Vá em "Cadastrar notebook".</div>';

  return `
    <h2 class="title">Painel</h2>
    <p class="sub">Situação atual do parque de notebooks.</p>
    ${state.msg && state.msg.where==='dashboard' ? `<div class="msg ${state.msg.type}">${state.msg.text}</div>` : ''}
    <div class="stats">
      <div class="stat ok"><div class="n">${disponiveis}</div><div class="l">Disponíveis</div></div>
      <div class="stat out"><div class="n">${retirados}</div><div class="l">Retirados</div></div>
      <div class="stat"><div class="n">${state.notebooks.length}</div><div class="l">Total cadastrado</div></div>
    </div>
    <div class="grid">${cards}</div>
  `;
}

function renderCadastro(){
  const c = state.cadastro;
  return `
    <h2 class="title">Cadastrar notebook</h2>
    <p class="sub">Registre o equipamento, e a tag NFC do ativo.</p>
    <div class="panel">
      ${state.msg && state.msg.where==='cadastrar' ? `<div class="msg ${state.msg.type}">${state.msg.text}</div>` : ''}
      <div class="row">
        <div class="field">
          <label>Nome / modelo do notebook</label>
          <input id="c-nome" type="text" placeholder="Ex: Dell Latitude 5440" value="${escapeAttr(c.nome)}">
        </div>
        <div class="field">
          <label>Nº de patrimônio</label>
          <input id="c-patr" class="mono-input" type="text" placeholder="Ex: TI-0042" value="${escapeAttr(c.patrimonio)}">
        </div>
      </div>

      <div class="nfc-box">
        <div class="lbl">Tag NFC</div>
        <div class="nfc-status">
          <span class="dot ${c.nfcOk?'on':''}"></span>
          <span>${c.nfcOk ? 'Tag vinculada: ' + c.nfcTag : 'Nenhuma tag lida ainda'}</span>
        </div>
        <div class="btnrow" style="margin-top:10px;">
          <button class="btn secondary small" data-action="ler-nfc-cadastro">Ler tag NFC</button>
        </div>
        <div class="hint">Web NFC funciona em Chrome para Android com o site em HTTPS. No iPhone e em outros aparelhos, grave a tag como link (?tag=CÓDIGO) e encoste o celular nela.</div>
      </div>

      <div class="btnrow">
        <button class="btn full" data-action="salvar-cadastro">Salvar notebook</button>
      </div>
    </div>
  `;
}

function renderMovimentar(){
  const f = state.flow;
  const nbOptions = state.notebooks.map(n=>`<option value="${n.id}" ${f.notebook && f.notebook.id===n.id?'selected':''}>${escapeHtml(n.nome)} — ${escapeHtml(n.patrimonio||'s/patrimônio')} (${n.status==='disponivel'?'disponível':'retirado'})</option>`).join('');

  if(!state.notebooks.length){
    return `<h2 class="title">Registrar movimentação</h2><p class="sub">Saída ou devolução de equipamento.</p><div class="empty">Cadastre um notebook primeiro.</div>`;
  }

  const tipoAuto = f.notebook ? (f.notebook.status==='disponivel' ? 'saida' : 'entrada') : null;

  return `
    <h2 class="title">Registrar movimentação</h2>
    <p class="sub">Leia a tag NFC do equipamento e informe quem está com o notebook.</p>
    <div class="panel">
      ${state.msg && state.msg.where==='movimentar' ? `<div class="msg ${state.msg.type}">${state.msg.text}</div>` : ''}

      <div class="field">
        <label>Notebook</label>
        <select id="m-notebook" class="notebook-select">
          <option value="">Selecione…</option>
          ${nbOptions}
        </select>
      </div>

      ${f.notebook ? `
        <div class="msg info">Ação: <b>${tipoAuto==='saida' ? 'Saída (retirada)' : 'Entrada (devolução)'}</b> — status atual: ${f.notebook.status==='disponivel'?'disponível':'retirado por '+(f.notebook.retiradoPor||'—')}</div>

        <div class="field">
          <label>${tipoAuto==='saida' ? 'Nome de quem está retirando o notebook' : 'Nome de quem está devolvendo o notebook'}</label>
          <input id="m-pessoa" type="text" placeholder="Nome completo" value="${escapeAttr(f.pessoa)}">
        </div>

        <div class="step ${f.step===1?'active':(f.nfcOk?'done':'')}">
          <div class="num">${f.nfcOk?'✓':'1'}</div>
          <div class="txt">Ler tag NFC do notebook</div>
        </div>
        <div class="step ${f.step===3?'active':''}">
          <div class="num">2</div>
          <div class="txt">Concluir</div>
        </div>

        ${f.step===1 ? `
          <div class="nfc-box">
            <div class="nfc-status"><span class="dot wait"></span><span>Aguardando leitura da tag…</span></div>
            <div class="btnrow" style="margin-top:10px;">
              <button class="btn secondary small" data-action="ler-nfc-mov">Ler tag NFC</button>
            </div>
          </div>
        ` : ''}

        ${f.step===3 ? `
          <div class="btnrow">
            <button class="btn full" data-action="concluir-mov">${tipoAuto==='saida' ? 'Confirmar saída' : 'Confirmar devolução'}</button>
          </div>
        ` : ''}
      ` : ''}
    </div>
  `;
}

function renderHistorico(){
  const rows = state.movimentos.slice().reverse().map(m=>`
    <tr>
      <td class="mono">${fmtDate(m.timestamp)}</td>
      <td>${escapeHtml(m.notebookNome)}</td>
      <td><span class="tipo ${m.tipo}">${m.tipo==='saida'?'Saída':'Entrada'}</span></td>
      <td>${escapeHtml(m.pessoa)}</td>
      <td class="mono">${escapeHtml(m.nfcTag||'—')}</td>
    </tr>
  `).join('');

  return `
    <h2 class="title">Histórico</h2>
    <p class="sub">Todas as saídas e devoluções registradas.</p>
    ${state.movimentos.length ? `
    <table>
      <thead><tr><th>Data/hora</th><th>Notebook</th><th>Tipo</th><th>Responsável</th><th>Tag</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>` : '<div class="empty">Nenhuma movimentação registrada ainda.</div>'}
  `;
}

function escapeHtml(s){ return (s||'').toString().replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escapeAttr(s){ return escapeHtml(s); }

/* ---------- Handlers ---------- */
function attachHandlers(){
  document.querySelectorAll('[data-nav]').forEach(btn=>{
    btn.onclick = ()=>{ state.view = btn.dataset.nav; state.msg=null; if(state.view==='movimentar'){} render(); };
  });

  const cNome = document.getElementById('c-nome');
  if(cNome) cNome.oninput = e=>{ state.cadastro.nome = e.target.value; };
  const cPatr = document.getElementById('c-patr');
  if(cPatr) cPatr.oninput = e=>{ state.cadastro.patrimonio = e.target.value; };

  const bindPop = document.querySelector('[data-action="fechar-popup"]');
  if(bindPop) bindPop.onclick = ()=>{ state.popup = null; render(); };

  const bind = (sel, fn) => { const el = document.querySelector(sel); if(el) el.onclick = fn; };

  bind('[data-action="ler-nfc-cadastro"]', async ()=>{
    state.msg = {where:'cadastrar', type:'info', text:'Aproxime a tag NFC do dispositivo…'};
    render();
    await readNfcTag(
      (id)=>{ state.cadastro.nfcTag = id; state.cadastro.nfcOk = true; state.msg={where:'cadastrar',type:'ok',text:'Tag lida com sucesso.'}; render(); },
      (err)=>{ state.msg = {where:'cadastrar', type:'err', text: err}; render(); }
    );
  });

  bind('[data-action="salvar-cadastro"]', async ()=>{
    const c = state.cadastro;
    if(!c.nome){ state.msg={where:'cadastrar',type:'err',text:'Informe o nome/modelo do notebook.'}; render(); return; }
    if(!c.nfcTag){ state.msg={where:'cadastrar',type:'err',text:'Leia a tag NFC.'}; render(); return; }
    if(state.notebooks.some(n=>n.nfcTag===c.nfcTag)){ state.msg={where:'cadastrar',type:'err',text:'Já existe um notebook cadastrado com essa tag.'}; render(); return; }
    try{
      const notebook = await apiFetch('/api/notebooks', {
        method: 'POST',
        body: JSON.stringify({ nome: c.nome, patrimonio: c.patrimonio, nfcTag: c.nfcTag })
      });
      state.notebooks.push(notebook);
      state.cadastro = { nome:'', patrimonio:'', nfcTag:'', nfcOk:false };
      state.msg = {where:'dashboard', type:'ok', text:'Notebook cadastrado.'};
      state.view = 'dashboard';
    }catch(e){
      state.msg = {where:'cadastrar', type:'err', text: 'Falha ao salvar: ' + e.message};
    }
    render();
  });

  const mSelect = document.getElementById('m-notebook');
  if(mSelect) mSelect.onchange = e=>{
    const nb = state.notebooks.find(n=>n.id===e.target.value);
    state.flow = { step:1, notebook: nb||null, nfcOk:false, pessoa:'', tipo: nb ? (nb.status==='disponivel'?'saida':'entrada') : null };
    render();
  };

  bind('[data-action="ler-nfc-mov"]', async ()=>{
    state.msg = {where:'movimentar', type:'info', text:'Aproxime a tag NFC do notebook…'};
    render();
    await readNfcTag(
      (id)=>{
        if(id !== state.flow.notebook.nfcTag){
          state.msg = {where:'movimentar', type:'err', text:'A tag lida não corresponde a este notebook.'};
        } else {
          state.flow.nfcOk = true; state.flow.step = 3;
          state.msg = {where:'movimentar', type:'ok', text:'Tag confirmada.'};
        }
        render();
      },
      (err)=>{ state.msg = {where:'movimentar', type:'err', text: err}; render(); }
    );
  });


  const mPessoa = document.getElementById('m-pessoa');
  if(mPessoa){
    mPessoa.oninput = e=>{ state.flow.pessoa = e.target.value; };
    // keep focus/cursor natural; value already restored via render
  }

  bind('[data-action="concluir-mov"]', async ()=>{
    const f = state.flow;
    const pessoa = (f.pessoa || '').trim();
    if(!pessoa){ state.msg={where:'movimentar',type:'err',text:'Informe o nome de quem está retirando/devolvendo.'}; render(); return; }
    try{
      const result = await apiFetch('/api/movimentos', {
        method: 'POST',
        body: JSON.stringify({ notebookId: f.notebook.id, nfcTag: f.notebook.nfcTag, pessoa })
      });
      const idx = state.notebooks.findIndex(n=>n.id===result.notebook.id);
      if(idx>=0) state.notebooks[idx] = result.notebook; else state.notebooks.push(result.notebook);
      state.movimentos.push(result.movimento);
      state.flow = { step:1, notebook:null, nfcOk:false, pessoa:'', tipo:null };
      state.msg = {where:'dashboard', type:'ok', text: result.movimento.tipo==='saida' ? `Saída registrada para ${pessoa}.` : `Devolução registrada por ${pessoa}.`};
      state.view = 'dashboard';
    }catch(e){
      state.msg = {where:'movimentar', type:'err', text: 'Falha ao registrar: ' + e.message};
    }
    render();
  });

  document.querySelectorAll('[data-del]').forEach(btn=>{
    btn.onclick = async ()=>{
      const nb = state.notebooks.find(n=>n.id===btn.dataset.del);
      if(!nb || !confirm('Excluir o notebook "' + nb.nome + '" (tag ' + nb.nfcTag + ')?')) return;
      try{
        await apiFetch('/api/notebooks/' + encodeURIComponent(nb.id), { method:'DELETE' });
        state.notebooks = state.notebooks.filter(n=>n.id!==nb.id);
        state.msg = {where:'dashboard', type:'ok', text:'Notebook excluído. A tag ' + escapeHtml(nb.nfcTag) + ' pode ser cadastrada de novo.'};
      }catch(e){
        state.msg = {where:'dashboard', type:'err', text:'Falha ao excluir: ' + e.message};
      }
      render();
    };
  });

  const cfgUrl = document.getElementById('cfg-url');
  if(cfgUrl) cfgUrl.oninput = e=>{ state.config.apiUrl = e.target.value; };
  const cfgKey = document.getElementById('cfg-key');
  if(cfgKey) cfgKey.oninput = e=>{ state.config.apiKey = e.target.value; };

  bind('[data-action="testar-api"]', async ()=>{
    saveConfig();
    await testApiConnection();
    state.msg = { where:'config', type: state.apiStatus==='ok' ? 'ok' : 'err', text: state.apiStatus==='ok' ? 'Conectado com sucesso.' : 'Não foi possível conectar. Confira a URL e se o servidor está no ar.' };
    render();
  });

  bind('[data-action="salvar-config"]', ()=>{
    saveConfig();
    state.msg = { where:'config', type:'ok', text:'Configuração salva.' };
    render();
    loadData();
  });
}

loadData();
</script>
</body>
</html>
